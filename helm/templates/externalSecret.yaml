{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.path }}
{{- fail "externalSecret.enabled is true but externalSecret.path is empty — the platform must supply the OpenBao path" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sandbox-api.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "sandbox-api.labels" . | indent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreKind }}
    name: {{ .Values.externalSecret.secretStoreName }}
  target:
    name: {{ include "sandbox-api.fullname" . }}-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.path }}
        property: {{ . }}
{{- end }}
{{- end }}
