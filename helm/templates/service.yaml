apiVersion: v1
kind: Service
metadata:
  name: {{ template "sandbox-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "sandbox-api.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ template "sandbox-api.name" . }}
    release: {{ .Release.Name }}
