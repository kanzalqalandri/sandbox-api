name: CI

# Dev-owned. Change this freely — CD mechanics live in platform-workflows and are
# not affected by anything here.
#
# Publishes ONE artifact and ONE version string for a RELEASE:
#   image → docker.io/<ns>/sandbox-api:<version>
#
# The CHART is not published to a registry: ArgoCD reads it straight from this
# repo. For a tagged release, `v<version>` is simultaneously the chart reference
# and the image tag — one string moves both, which is what keeps rollback from
# producing an old image against a new chart. The tag must therefore never be
# moved once pushed: a moved tag silently changes the chart under a version that
# is already deployed, with no commit anywhere to show it. In production this is
# why the chart is a published OCI artifact (as tenant-api already does) rather
# than a git ref: a registry digest cannot be rewritten, a git tag can.
#
# dev/<tenant-id>/<whatever> is different ON PURPOSE: chart ref = the BRANCH NAME
# (not a commit), image tag = whatever this push built. Two independent strings,
# because they answer two different questions — "which chart" tracks the branch
# continuously via ArgoCD's own polling, "which image" is this exact push. A
# chart-only change (no app code touched) needs no dispatch at all; only the image
# tag needs updating per push, and only `image` changes across pushes to the same
# branch — `branch` is written once.
#
# Requires, on this repo:
#   variable DOCKERHUB_NAMESPACE  (your Docker Hub user/org — not secret, it is
#                                  part of every image reference and must appear
#                                  in logs unmasked)
#   secret   DOCKERHUB_TOKEN      (access token with Read & Write)
#   variable DEV_CLUSTER          (the one dev cluster dev/*/** deploys pushed to)
#   secret   DISPATCH_TOKEN       (actions:write on kanzalqalandri/platform-workflows
#                                  only — dispatches the dev-branch deploy below)
#
# The image tag is baked into the chart's values.yaml before packaging, so a
# release pins the CHART version and gets a coherent chart+image.
#
#   tag v1.2.3    -> image 1.2.3, chart read from git tag v1.2.3       (releasable)
#   dev/<id>/*    -> image <slug>-<sha8>, chart ref = the branch itself
#   main          -> image main-<sha8>, chart read from that commit
#
# dev/<tenant-id>/<whatever> is the whole self-service dev loop: create the tenant
# ONCE with tenant-create.yml, then every push here updates ONLY this component of
# that tenant. Nobody runs a workflow by hand again.

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    branches: [main, 'dev/*/**']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  COMPONENT: sandbox-api

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.id.outputs.image_tag }}
      chart_ref: ${{ steps.id.outputs.chart_ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute the version string
        id: id
        run: |
          set -euo pipefail
          SHA8="${GITHUB_SHA::8}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME#v}"
            CHART_REF="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == dev/*/* ]]; then
            # chart ref = the branch itself, so ArgoCD tracks its HEAD on its own —
            # a chart-only change needs no dispatch. image is just this push.
            SLUG="${GITHUB_REF_NAME//\//-}"
            IMAGE_TAG="${SLUG}-${SHA8}"
            CHART_REF="${GITHUB_REF_NAME}"
          else
            SLUG="${GITHUB_REF_NAME//\//-}"
            IMAGE_TAG="${SLUG}-${SHA8}"
            CHART_REF="${GITHUB_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" | tee -a "$GITHUB_OUTPUT"
          echo "chart_ref=${CHART_REF}"  | tee -a "$GITHUB_OUTPUT"

      - name: Parse the dev tenant from the branch name
        id: dev
        if: ${{ startsWith(github.ref_name, 'dev/') }}
        run: |
          set -euo pipefail
          IFS='/' read -ra PARTS <<< "${GITHUB_REF_NAME}"
          if [ "${#PARTS[@]}" -lt 3 ] || [ -z "${PARTS[1]}" ]; then
            echo "::error::branch '${GITHUB_REF_NAME}' does not match dev/<tenant-id>/<whatever>"
            exit 1
          fi
          echo "tenant=dev-${PARTS[1]}" | tee -a "$GITHUB_OUTPUT"

      - name: Check the registry is configured
        run: |
          if [ -z "${NAMESPACE}" ]; then
            echo "::error::repository variable DOCKERHUB_NAMESPACE is not set."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::repository secret DOCKERHUB_TOKEN is not set."
            exit 1
          fi

      - name: Log in to the registry
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "$NAMESPACE" --password-stdin

      - name: Build and push the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.COMPONENT }}
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}:${{ steps.id.outputs.image_tag }}" .
          docker push "${IMAGE}:${{ steps.id.outputs.image_tag }}"

      - name: Validate the chart that ArgoCD will read from this ref
        run: |
          set -euo pipefail
          # ArgoCD renders helm/ straight from this commit, so a chart that does
          # not template here is a chart that will not deploy. Fail now, not in a
          # ComparisonError twenty minutes later.
          helm lint helm
          helm template "$COMPONENT" helm --set image.tag="${{ steps.id.outputs.image_tag }}" >/dev/null

          # The chart's committed image.repository must match where CI actually
          # pushed, or the platform would set a tag on the wrong image.
          WANT="${REGISTRY}/${NAMESPACE}/${COMPONENT}"
          GOT=$(yq -r '.image.repository' helm/values.yaml)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error file=helm/values.yaml::image.repository is '$GOT', expected '$WANT'"
            exit 1
          fi
          echo "chart at ${{ steps.id.outputs.chart_ref }} deploys ${WANT}:${{ steps.id.outputs.image_tag }}"

      - name: Deploy to the dev tenant
        # The whole point: nobody runs a workflow by hand after tenant-create.
        # This only ever UPDATES an existing tenant — tenant-component-version.yml
        # refuses on one that does not exist, by design, so a typo'd tenant id
        # fails loudly here instead of silently creating a stray tenant.
        if: ${{ startsWith(github.ref_name, 'dev/') }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::repository secret DISPATCH_TOKEN is not set (needs actions:write on kanzalqalandri/platform-workflows only)."
            exit 1
          fi
          if [ -z "${{ vars.DEV_CLUSTER }}" ]; then
            echo "::error::repository variable DEV_CLUSTER is not set."
            exit 1
          fi
          gh workflow run tenant-component-version.yml -R kanzalqalandri/platform-workflows --ref main \
            -f instance="${{ steps.dev.outputs.tenant }}" \
            -f cluster="${{ vars.DEV_CLUSTER }}" \
            -f component="${COMPONENT}" \
            -f branch="${{ github.ref_name }}" \
            -f image="${{ steps.id.outputs.image_tag }}"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "| artifact | reference |"
            echo "|---|---|"
            echo "| image | \`${REGISTRY}/${NAMESPACE}/${COMPONENT}:${{ steps.id.outputs.image_tag }}\` |"
            echo "| chart | \`${{ github.repository }}//helm @ ${{ steps.id.outputs.chart_ref }}\` |"
            echo
            if [ -n "${{ steps.dev.outputs.tenant }}" ]; then
              echo "Deployed to \`${{ steps.dev.outputs.tenant }}\` on \`${{ vars.DEV_CLUSTER }}\` automatically."
            else
              echo "Deploy it:"
              echo '```'
              echo "gh workflow run tenant-version.yml -R ${{ github.repository_owner }}/platform-workflows \\"
              echo "  -f instance=<tenant> -f cluster=<cluster> -f version=${{ steps.id.outputs.image_tag }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
